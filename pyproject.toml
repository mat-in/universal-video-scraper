[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-scraper"
version = "0.1.0"
description = "Universal video extractor CLI: find and download embedded videos from arbitrary webpages."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "video-scraper" }]
keywords = ["video", "scraper", "downloader", "yt-dlp", "hls", "dash"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2026.8.19",
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "lxml>=6.0",
    "playwright>=1.54",
    "typer>=0.16",
    "rich>=14.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
]

[project.scripts]
video-scraper = "video_scraper.cli:app"

[tool.setuptools.packages.find]
include = ["video_scraper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: live-network tests, excluded from default runs",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
